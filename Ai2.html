
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAFA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1424;color:white;font-family:Arial;height:100vh;display:flex;overflow:hidden}
.sidebar{width:82px;background:#101d31;padding:15px 8px;display:flex;align-items:center;flex-direction:column;gap:20px}
.logo{font-weight:bold;color:#54aaff;font-size:16px;text-align:center;line-height:1.3}
.new{background:#1d3555;border:1px solid #345477;color:white;width:64px;height:65px;border-radius:15px;font-size:25px;cursor:pointer}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{padding:20px;border-bottom:1px solid #24334a;font-size:19px;font-weight:bold}
.status{font-size:13px;color:#54c99b;margin-top:7px}
#chat{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;margin:auto;max-width:500px}
.welcome h1{font-size:35px;color:#62b5ff}
.welcome p{color:#9baac0;line-height:1.7}
.message{max-width:750px;width:fit-content;padding:14px 17px;border-radius:17px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.user{align-self:flex-end;background:#205b91}
.ai{align-self:flex-start;background:#172941}
.input-area{padding:15px 15px 22px;border-top:1px solid #24334a}
.input-box{max-width:850px;margin:auto;display:flex;gap:10px;background:#172941;border:1px solid #345477;border-radius:18px;padding:9px}
textarea{flex:1;resize:none;background:transparent;color:white;border:0;outline:0;padding:13px;font:15px Arial;max-height:130px}
.send{background:#2588dc;border:0;color:white;width:48px;height:48px;border-radius:13px;font-size:23px;cursor:pointer}
.send:disabled{opacity:.5}
.note{text-align:center;color:#72839a;font-size:11px;margin-top:10px}
.typing{color:#83bfff}
@media(max-width:500px){
.sidebar{width:70px}
header{padding:17px}
#chat{padding:18px 12px}
.message{font-size:14px}
}
</style>
</head>
<body>

<aside class="sidebar">
 <div class="logo">✦ DAFA<br>AI</div>
 <button class="new" onclick="newChat()">＋</button>
</aside>

<main>
<header>
 DAFA AI
 <div class="status">● AI Assistant</div>
</header>

<div id="chat">
 <div class="welcome" id="welcome">
  <h1>Halo! 👋</h1>
  <h2>Ada yang bisa saya bantu?</h2>
  <p>Saya DAFA AI. Tanyakan apa saja, mulai dari pelajaran, matematika, teknologi, hingga coding.</p>
 </div>
</div>

<div class="input-area">
 <div class="input-box">
  <textarea id="prompt" rows="1" placeholder="Tanyakan sesuatu kepada DAFA AI..."></textarea>
  <button class="send" id="send" onclick="sendMessage()">➤</button>
 </div>
 <div class="note">DAFA AI bisa membuat kesalahan. Periksa kembali informasi penting.</div>
</div>
</main>

<script>
const chat=document.getElementById("chat");
const promptBox=document.getElementById("prompt");
const sendBtn=document.getElementById("send");

let history=[];

function addMessage(text,type){
 const el=document.createElement("div");
 el.className="message "+type;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
 return el;
}

function newChat(){
 history=[];
 chat.innerHTML=`
 <div class="welcome" id="welcome">
 <h1>Halo! 👋</h1>
 <h2>Ada yang bisa saya bantu?</h2>
 <p>Saya DAFA AI. Tanyakan apa saja!</p>
 </div>`;
 promptBox.focus();
}

async function sendMessage(){
 const text=promptBox.value.trim();
 if(!text || sendBtn.disabled)return;

 document.getElementById("welcome")?.remove();

 addMessage(text,"user");
 promptBox.value="";
 sendBtn.disabled=true;

 const loading=addMessage("DAFA AI sedang berpikir...","ai typing");

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    history:history
   })
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error || "Server AI mengalami masalah.");
  }

  if(!data.reply){
   throw new Error("AI tidak memberikan jawaban.");
  }

  loading.remove();
  addMessage(data.reply,"ai");

  history.push(
   {role:"user",content:text},
   {role:"assistant",content:data.reply}
  );

  // Batasi riwayat percakapan
  history=history.slice(-12);

 }catch(error){
  loading.textContent="Gagal menghubungkan AI: "+error.message;
 }

 sendBtn.disabled=false;
 promptBox.focus();
}

promptBox.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
</script>
</body>
</html>
